# Bloque 3 — fronteras dinámicas difíciles.
# phase1_audit.yaml no se modifica. Los rangos de Hurst, ARMA, Rössler, Hénon,
# logístico débil y el empalme de régimen viven en los dataclasses de
# tsg.generators.config (valores por defecto de la especificación).
audit:
  n_steps: 1500
  n_realizations: 30
  seed: 42
  profile: paper
  brownian_mode: levels   # trayectoria integrada (brownian y ambos fBm)
  n_folds: 5
  variance_eps: 1.0e-12
  figure_dpi: 300
  profiles:
    dev:
      n_realizations: 10
      n_steps: 1000
    paper:
      n_realizations: 30
      n_steps: 1500
  regimes:
    - white_noise
    - fbm_antipersistent
    - brownian
    - fbm_persistent
    - arma_correlated
    - quasiperiodic
    - lorenz
    - rossler
    - henon
    - logistic_weak
    - logistic
    - regime_switching
  methods:
    - NVG
    - HVG
    - RN
    - kNN
    - STN
    - OPN
    - Correlation
    - Segment
  families:
    visibility: [NVG, HVG]
    transition: [STN, OPN]
    proximity: [RN, kNN]
    similarity: [Correlation, Segment]
  critical_pairs:
    - [arma_correlated, lorenz]
    - [lorenz, rossler]
    - [fbm_persistent, brownian]
    - [logistic_weak, logistic]
    - [regime_switching, quasiperiodic]

# Classification protocol that keeps Macro-F1 off the ceiling.
# The clean ensemble above (N=1500, R=30) is unchanged and stays the
# geometry / cache source for B1. ``null`` SNR is the clean series (∞).
# Headline rule (a priori, see hard_frontiers_difficulty.resolve_headline):
#   start at N=500, SNR=20 dB;
#   if full RF CV Macro-F1 ≥ 0.98 or its OOF bootstrap CI includes 1,
#   move to N=250, SNR=20 dB;
#   if full RF CV Macro-F1 < 0.80, pick the grid point closest to 0.875;
#   if the chosen point is still outside [0.80, 0.95] or its CI includes 1,
#   pick the in-range grid point closest to 0.875 whose CI excludes 1.
difficulty:
  n_grid: [250, 500, 750, 1000, 1500]
  snr_db: [null, 20, 10]
  n_realizations: 20
  n_bootstrap: 1000
  bootstrap_seed: 42
  headline:
    n_steps: 500
    snr_db: 20
