[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsg"
version = "0.5.0"
description = "Series sintéticas multirrégimen, mapeo TS2G, matriz D y auditoría de discriminabilidad"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "plotly>=5.18",
    "networkx>=3.0",
    "scipy>=1.10",
    "ts2vg>=1.2",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
rq1 = [
    "dit[broja]>=1.5",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
